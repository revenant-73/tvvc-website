[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/teams.html"
  to = "/teams"
  status = 301
  force = true

[[redirects]]
  from = "/faq.html"
  to = "/faq"
  status = 301
  force = true

[[redirects]]
  from = "/boys-volleyball.html"
  to = "/boys-volleyball"
  status = 301
  force = true

[[redirects]]
  from = "/boys-volleyball/thanks.html"
  to = "/boys-volleyball/thanks"
  status = 301
  force = true

[[redirects]]
  from = "/events.html"
  to = "/events"
  status = 301
  force = true

[[redirects]]
  from = "/privacy-policy.html"
  to = "/privacy-policy"
  status = 301
  force = true

[[redirects]]
  from = "/privacy-security.html"
  to = "/privacy-security"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer-when-downgrade"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.google.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https://www.google.com https://maps.gstatic.com https://*.googleapis.com https://*.ggpht.com; frame-src 'self' https://www.google.com; connect-src 'self' https://*.turso.io;"
